<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark Golf — hero preview</title>
<meta name="description" content="Drop hero video variations and preview them across desktop and mobile frames at true proportions, all playing in sync.">
<link rel="preload" href="assets/fonts/HankenGrotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/preview.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
</head>
<body>

<header class="top">
  <div class="top__id">
    <img src="assets/img/logo-header.png" alt="Benchmark Golf" width="150" height="39">
    <span>hero preview</span>
  </div>

  <div class="top__mid" data-transport hidden>
    <button class="ctl ctl--play" type="button" data-play aria-label="Play or pause (Space)">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.2 19 12 8 18.8V5.2Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.5 5h3.2v14H7.5zM13.3 5h3.2v14h-3.2z"/></svg>
    </button>
    <button class="ctl" type="button" data-restart title="Restart (R)" aria-label="Restart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 12a7.2 7.2 0 1 0 2.2-5.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M4.4 4.6v4.2h4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="clock"><b data-cur>0:00.00</b> / <span data-dur>0:00.00</span></span>
    <input class="scrub" type="range" min="0" max="1000" value="0" data-scrub aria-label="Timeline">
    <div class="seg" role="group" aria-label="Speed">
      <button type="button" data-rate="0.25">¼×</button>
      <button type="button" data-rate="0.5">½×</button>
      <button type="button" data-rate="1" class="is-on">1×</button>
      <button type="button" data-rate="2">2×</button>
    </div>
    <button class="ctl ctl--txt is-on" type="button" data-loop aria-pressed="true" title="Loop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.8h9.2a3.6 3.6 0 0 1 3.6 3.6v.6M17 18.2H7.8a3.6 3.6 0 0 1-3.6-3.6v-.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M14.6 3.4 17 5.8l-2.4 2.4M9.4 20.6 7 18.2l2.4-2.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Loop</span>
    </button>
  </div>

  <div class="top__end">
    <button class="ctl ctl--txt" type="button" data-add="desktop" title="Add a desktop frame">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="4.6" width="18.4" height="12.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8.4 20h7.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Desktop</span>
    </button>
    <button class="ctl ctl--txt" type="button" data-add="mobile" title="Add a mobile frame">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.8" width="10" height="18.4" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.8 5.6h2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Mobile</span>
    </button>
    <button class="ctl ctl--txt" type="button" data-add-set title="Add a desktop + mobile pair">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.6" y="5.6" width="12.4" height="9.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="17" y="4.4" width="4.6" height="14.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.4 18h4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Set</span>
    </button>
    <button class="ctl ctl--txt" type="button" data-browse>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Add videos</span>
    </button>
    <button class="ctl ctl--txt" type="button" data-clear title="Remove every clip">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 6.8h12.8M9.8 6.8V5.2a1.2 1.2 0 0 1 1.2-1.2h2a1.2 1.2 0 0 1 1.2 1.2v1.6M7.4 6.8l.7 12a1.3 1.3 0 0 0 1.3 1.2h5.2a1.3 1.3 0 0 0 1.3-1.2l.7-12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a class="ctl ctl--txt" href="reference.html" title="The full page rebuilt from the comp"><span>Full page ↗</span></a>
  </div>
</header>

<main class="board" data-board>
  <div class="col col--desktop" data-col="desktop"></div>
  <div class="col col--mobile" data-col="mobile"></div>
</main>

<p class="hint">
  Drop a video on a frame to load just that one · drop several anywhere to fill every frame ·
  <b>Space</b> play/pause · <b>←/→</b> 1s · <b>⇧←/→</b> one frame · <b>R</b> restart · <b>M</b> mute.
  Files stay in your browser — nothing is uploaded.
</p>

<div class="veil" data-veil aria-hidden="true"><span>Release to load</span></div>
<input type="file" accept="video/*" multiple hidden data-file>

<script src="assets/js/preview.js" defer></script>
</body>
</html>
